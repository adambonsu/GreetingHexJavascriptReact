name: Network Tests
run-name: 'Network Tests run by @${{ github.actor }}, event: ${{ github.event_name }}'
on:
  workflow_call:
  workflow_dispatch:
concurrency:
  group: network-test ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  no-network:
    runs-on: ubuntu-latest
    steps:
      - name: Step not implemented yet
        run: |
          echo "Not implemented yet"
  good-network:
    runs-on: ubuntu-latest
    steps:
      - name: Step not implemented yet
        run: |
          echo "Not implemented yet"
  bad-network:
    runs-on: ubuntu-latest
    steps:
      - name: Step not implemented yet
        run: |
          echo "Not implemented yet"
