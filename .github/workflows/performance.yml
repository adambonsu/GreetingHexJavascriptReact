name: Performance Tests
run-name: 'Performance Tests run by @${{ github.actor }}, event: ${{ github.event_name }}'
on:
  workflow_call:
  workflow_dispatch:
concurrency:
  group: performance-test ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  performance-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Authenticate with GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}" >> ~/.npmrc
      - name: Install dependencies
        run: npm ci
      - name: Run Reassure performance tests
        run: reassure
      - name: Upload performance test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: reassure-output.json
      - name: Analyze performance results
        if: always()
        run: |
          reassure check --threshold 10
        continue-on-error: true
